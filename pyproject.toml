[project]
name = "edgar-sentinel"
version = "2.0.0.dev0"
description = "A market research platform for any US-traded stock: filings, fundamentals, insider activity, and dilution, results-day and volatility forecasts."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "duckdb>=1.5.6,<2",
    "pyarrow>=25.0.1,<26",
    "pyyaml>=6.0.3,<7",
    "python-dotenv>=1.2.4,<2",
    "typer>=0.27.3,<0.28",
    "yfinance>=1.7,<1.8",
    "pandas>=3.0.6,<3.1",
    "numpy>=2.5.4,<2.6",
    "scipy>=1.18.1,<1.19",
    "scikit-learn>=1.9,<1.10",
    "lightgbm>=4.7,<4.8",
    "mlflow>=3.17,<3.18",
    "matplotlib>=3.10,<4",
    "fastapi>=0.156,<0.160",
    "uvicorn>=0.54,<0.55",
    "jinja2>=3.1.6,<4",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.17.1,<0.18",
    "respx>=0.23.1,<0.24",
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "nbstripout>=0.9.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sentinel"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: checks on the real data/sentinel.duckdb (skipped without it)",
    "network: needs the internet (run with --run-network)",
]
