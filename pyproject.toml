[project]
name = "edgar-sentinel"
version = "0.1.0"
description = "Do clusters of insider purchases predict returns net of costs? SEC Form 4 research pipeline and screener."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "duckdb>=1.5.6,<2",
    "pyarrow>=25.0.1,<26",
    "pyyaml>=6.0.3,<7",
    "python-dotenv>=1.2.4,<2",
    "typer>=0.27.3,<0.28",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.17.1,<0.18",
    "respx>=0.23.1,<0.24",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sentinel"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["network: needs internet; run with --run-network"]
