# EDGAR-SENTINEL parameter file — the single home of every numeric parameter
# (constitution Principle III). Structure: specs/001-skeleton-sec-ingest/contracts/params-schema.md
#
# registered:  one entry per row of docs/initialplan.md Appendix E. The `register` block holds the
#              row's cells VERBATIM; tests/unit/test_params_register.py fails if they drift.
# ops:         operational settings (rate limits, URLs) — not research parameters.
# rules:       research rules that are not numeric Appendix E rows (keyword lists, the preliminary
#              cooldown) but that the prereg-v1 tag locks. Contract:
#              specs/002-insider-warehouse/contracts/params-rules.md
# provisional: the pilot's simplified rules (Appendix A) — NOT pre-registered.

version: 8

registered:
  insider_data_period:
    value: {start: 2006q1, end: 2026q3}
    unit: quarter
    register:
      parameter: "Insider data period"
      value: "2006 Q1 – 2026 Q3"
      sensitivity: "—"
  labelled_window_start:
    value: 2012-01-01
    unit: date
    sensitivity: [2016-01-01]
    register:
      parameter: "Labelled window start"
      value: "1 Jan 2012"
      sensitivity: "2016 start (smaller; best price coverage)"
  holdout:
    value: {start: 2023-01-01, end: 2026-06-01}
    unit: signal_date_range
    register:
      parameter: "Holdout"
      value: "Signal dates 1 Jan 2023 – 1 Jun 2026"
      sensitivity: "Fixed"
  g6_min_value:
    value: 25000
    unit: usd_per_entity_per_filing
    sensitivity: [10000, 50000]
    register:
      parameter: "G6 minimum value"
      value: "$25,000 per entity per filing"
      sensitivity: "$10k; $50k"
  g6_timeliness:
    value: 30
    unit: calendar_days_after_trade
    sensitivity: [10, 90]
    register:
      parameter: "G6 timeliness"
      value: "Filed ≤ 30 days after the trade"
      sensitivity: "10; 90 days"
  g8_tolerance:
    value: 0.10
    unit: fraction_of_day_range
    register:
      parameter: "G8 tolerance"
      value: "±10% of the day's range"
      sensitivity: "Convention"
  cluster_window:
    value: 14
    unit: calendar_days
    sensitivity: [7, 30]
    register:
      parameter: "Cluster window"
      value: "14 calendar days"
      sensitivity: "7; 30 days"
  cluster_min_entities:
    value: 2
    unit: entities_incl_officer_or_director
    sensitivity: [3]
    register:
      parameter: "Cluster minimum entities"
      value: "2, including an officer or director"
      sensitivity: "3"
  cluster_min_value:
    value: 100000
    unit: usd
    sensitivity: [50000, 250000]
    register:
      parameter: "Cluster / solo minimum value"
      value: "$100,000"
      sensitivity: "$50k; $250k"
  cooldown:
    value: 63
    unit: sessions
    sensitivity: [{calendar_days: 21}]
    register:
      parameter: "Cooldown"
      value: "63 sessions"
      sensitivity: "21 calendar days"
  price_floor:
    value: 2.00
    unit: usd_unadjusted_close
    sensitivity: [1.00, 5.00]
    register:
      parameter: "Price floor"
      value: "Unadjusted close ≥ $2"
      sensitivity: "$1; $5"
  position_size:
    value: 10000
    unit: usd
    sensitivity: [25000, 50000]
    register:
      parameter: "Position size Q"
      value: "$10,000"
      sensitivity: "$25k; $50k"
  liquidity_floor:
    value: {addv_window_sessions: 20, min_addv_usd: 100000, max_share_of_volume: 0.10}
    unit: usd_addv20
    sensitivity: [250000, 500000]
    register:
      parameter: "Liquidity floor"
      value: "ADDV20 ≥ $100k (= Q ÷ 10%)"
      sensitivity: "$250k (Q = $25k); $500k (Q = $50k)"
  activity_floor:
    value: {min_active_sessions: 18, window_sessions: 20}
    unit: sessions_with_volume
    sensitivity: [{min_active_sessions: 15, window_sessions: 20}]
    register:
      parameter: "Activity floor"
      value: "Volume on ≥ 18 of 20 sessions"
      sensitivity: "15 of 20"
  horizons:
    value: [5, 21, 63, 126, 252]
    unit: sessions
    register:
      parameter: "Horizons"
      value: "5, 21, 63, 126, 252 sessions"
      sensitivity: "—"
  primary_horizon:
    value: 63
    unit: sessions
    register:
      parameter: "Primary horizon"
      value: "63 sessions"
      sensitivity: "Other horizons reported"
  factor_beta_window:
    value: {start_offset: -252, end_offset: -21, min_observations: 120}
    unit: sessions_relative_to_T
    register:
      parameter: "Factor beta window"
      value: "Sessions T−252 to T−21, ≥ 120 observations"
      sensitivity: "Convention"
  spread_addv_window:
    value: 20
    unit: sessions
    register:
      parameter: "Spread and ADDV window"
      value: "20 sessions"
      sensitivity: "Convention"
  volatility_window:
    value: 63
    unit: sessions
    register:
      parameter: "Volatility window"
      value: "63 sessions"
      sensitivity: "Convention"
  impact_coefficient:
    value: 1.0
    unit: dimensionless
    sensitivity: [0.5, 2.0]
    register:
      parameter: "Impact coefficient"
      value: "1"
      sensitivity: "0.5; 2"
  delisting_returns:
    value:
      acquired: 0.0
      performance_nyse_or_nyse_american: -0.30
      performance_nasdaq: -0.55
      unknown_treated_as: performance
      other_venue_treated_as: performance_nasdaq
    unit: return
    sensitivity: [0.0, -1.0]
    register:
      parameter: "Delisting returns"
      value: "0% acquired; −30% NYSE/NYSE American; −55% Nasdaq and other venues; unknown = performance-related"
      sensitivity: "0%; −100%"
  merger_lookback:
    value: 12
    unit: months_before_last_trade
    register:
      parameter: "Merger look-back"
      value: "12 months before the last trade"
      sensitivity: "Convention"
  selling_lookback:
    value: 90
    unit: calendar_days
    register:
      parameter: "Selling look-back (F12, F13)"
      value: "90 days"
      sensitivity: "Convention"
  repeat_buying_lookback:
    value: 365
    unit: calendar_days
    register:
      parameter: "Repeat-buying look-back (F14)"
      value: "365 days"
      sensitivity: "Convention"
  routine_definition:
    value: {same_calendar_month_prior_years: 3}
    unit: years
    register:
      parameter: "Routine definition (F9)"
      value: "Same calendar month in each of 3 prior years"
      sensitivity: "—"
  f10_shrinkage:
    value: {k: 5, base_rate_months: 36}
    unit: pseudo_events
    register:
      parameter: "F10 shrinkage"
      value: "k = 5, toward the 36-month base rate"
      sensitivity: "Convention"
  winsorising:
    value: {lower: 0.01, upper: 0.99}
    unit: percentile
    register:
      parameter: "Winsorising"
      value: "1st / 99th percentiles"
      sensitivity: "Convention"
  training_window_split:
    value: {tuning_months: 6, calibration_months: 6}
    unit: months
    register:
      parameter: "Training-window split"
      value: "Last 12 months = 6 tuning + 6 calibration"
      sensitivity: "Convention"
  fold1_min_fit_size:
    value: 500
    unit: events
    register:
      parameter: "Fold-1 minimum fit size"
      value: "500 events"
      sensitivity: "Convention"
  portfolio_cutoff:
    value: 0.80
    unit: percentile
    sensitivity: [0.6667]
    register:
      parameter: "Portfolio cut-off"
      value: "80th percentile (top quintile)"
      sensitivity: "Top tercile"
  calendar_time_min_positions:
    value: 10
    unit: positions_per_day
    sensitivity: [1]
    register:
      parameter: "Calendar-time minimum positions"
      value: "10 per day"
      sensitivity: "Keep all days"
  newey_west_lags:
    value: {monthly_series: "ceil(H/21)", daily_regressions: 10}
    unit: lags
    register:
      parameter: "Newey–West lags"
      value: "⌈H/21⌉ (monthly series); 10 (daily regressions)"
      sensitivity: "Convention"
  significance:
    value: {alpha: 0.05, sided: one, correction: holm_bonferroni, n_tests: 5}
    unit: probability
    register:
      parameter: "Significance"
      value: "One-sided 5%; Holm–Bonferroni over five tests"
      sensitivity: "—"
  model_grids:
    value: {n_configurations: 25, defined_in: "docs/initialplan.md §7.2"}
    unit: configurations
    register:
      parameter: "Model grids"
      value: "§7.2 (25 configurations)"
      sensitivity: "—"

ops:
  sec_target_requests_per_second: 5
  sec_max_requests_per_second: 10
  http_timeout_seconds: 60
  http_max_attempts: 5
  http_backoff_base_seconds: 2
  http_backoff_max_seconds: 120
  sec_landing_page: "https://www.sec.gov/data-research/sec-markets-data/insider-transactions-data-sets"
  sec_folder_patterns:
    - "https://www.sec.gov/files/structureddata/data/insider-transactions-data-sets/{key}_form345.zip"
    - "https://www.sec.gov/files/datastandardsinnovation/data/insider-transactions-data-sets/{key}_form345.zip"
  sec_company_tickers_url: "https://www.sec.gov/files/company_tickers_exchange.json"
  tiingo_supported_tickers_url: "https://apimedia.tiingo.com/docs/tiingo/daily/supported_tickers.zip"
  required_archive_tables: [SUBMISSION, REPORTINGOWNER, NONDERIV_TRANS, FOOTNOTES]
  sec_header_target_requests_per_second: 8
  sec_headers_url_pattern: "https://www.sec.gov/Archives/edgar/data/{cik}/{acc_nodash}/{acc}-index-headers.html"
  # Used when the page above is HTTP 404, as it is for many 2012–2014 filings (feature 004 run notes)
  sec_headers_fallback_url_pattern: "https://www.sec.gov/Archives/edgar/data/{cik}/{acc_nodash}/{acc}.hdr.sgml"
  # Market data (feature 004; contracts/params-rules.md)
  reference_symbols: [SPY, IWM]
  yahoo_batch_size: 50
  yahoo_pause_seconds: 2
  # The one paid Tiingo month (D39). Tiingo data may be written only inside [from, until).
  # Subscribed 2026-10-26; the plan ends 2026-11-26, so every Tiingo file and row must be deleted
  # (`sentinel tiingo-delete`) by 25 November.
  tiingo_paid_from: 2026-10-26
  tiingo_paid_until: 2026-11-26
  tiingo_requests_per_second: 2
  tiingo_api_base: "https://api.tiingo.com/tiingo/daily"
  sec_companyfacts_url: "https://www.sec.gov/Archives/edgar/daily-index/xbrl/companyfacts.zip"
  sec_submissions_url: "https://www.sec.gov/Archives/edgar/daily-index/bulkdata/submissions.zip"
  french_base_url: "https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/"
  french_files:
    - F-F_Research_Data_5_Factors_2x3_daily_CSV.zip
    - F-F_Momentum_Factor_daily_CSV.zip
    - F-F_ST_Reversal_Factor_daily_CSV.zip
    - 49_Industry_Portfolios_daily_CSV.zip
    - 12_Industry_Portfolios_daily_CSV.zip
    - Siccodes49.zip
    - Siccodes12.zip
    - ME_Breakpoints_CSV.zip
  finra_tick_pilot_url: "https://tsp.finra.org/finra_org/ticksizepilot/TSPilotChanges.txt"
  # SC-005: single-class, Yahoo-priced event companies with shares filed since 2026-04-01, two
  # per market-cap quintile, drawn with seed 20261024 (feature 004 run notes, T054)
  market_cap_examples: [JELD, NSPR, LYTS, RMBI, INVA, PRCH, PENG, CVCO, VTR, PFE]

rules:
  # Production gates (plan §6.2), applied case-insensitively. Initial values = provisional.*
  gate_common_title_regex: 'common|ordinary|\bclass [a-z]\b|\bshares?\b'
  gate_excluded_title_regex: 'preferred|warrant|\bunits?\b|\bnotes?\b|option|\brights?\b|debenture'
  gate_plan_footnote_regex: '10b5-?1|10b-?5-?1|dividend reinvest|\bDRIP\b|employee stock purchase|\bESPP\b|automatic(ally)?\s+(purchase|reinvest)|reinvest(ed|ment) of dividends'
  gate_offering_footnote_regex: 'public offering|underwrit|private placement|registered direct|subscription agreement|securities purchase agreement|\bPIPE\b|rights offering|directly from the (company|issuer)|from the issuer'
  # Roles (plan §6.3)
  role_ceo_cfo_title_regex: '\bCEO\b|\bCFO\b|chief executive|chief financial|principal executive|principal financial'
  # Preliminary events only (plan §6.4; about 63 sessions). Final events use registered.cooldown.
  prelim_cooldown_calendar_days: 91
  # Final detection (plan §6.4; feature 004 research R1, R7): a six-month warm-up before the
  # labelled window, so cooldowns are settled on its first day. Prices start a year earlier.
  final_detection_start: 2011-07-01
  price_history_start: 2010-01-01
  # G7 (plan §6.2; D45). g7_no_sic: exclude | current_sic (the §11 fallback, set by the D45 check)
  g7_excluded_sic: [6770, 6722, 6726]
  g7_no_sic: exclude
  # Delistings (plan §6.7; research R11). Forms match by prefix, so amendments count.
  delisting_merger_forms: [DEFM14A, DEFM14C, PREM14A, PREM14C, SC 14D9, SC TO-T, SC 13E3, "425"]
  delisting_performance_forms: ["25", 25-NSE, 15-12B, 15-12G, 15-15D]
  delisting_notice_after_months: 12
  delisting_end_gap_sessions: 5
  remap_after_days: 90
  # Costs (plan §6.5, §6.8; research R13, R14)
  tick_size_usd: 0.01
  tick_size_pilot_usd: 0.05
  min_volatility_returns: 40
  # ML dataset (plan §7.2; feature 006 research R11): the four yearly walk-forward test folds
  ml_test_years: [2019, 2020, 2021, 2022]

provisional:
  # The pilot's G6 minimum per filing (Appendix A). Production uses registered.g6_min_value,
  # $25k since D46; feature 001's provisional outputs were built with this value.
  filing_min_value: 10000
  price_standin_floor: 2.0
  cooldown_calendar_days: 91
  min_buyers_cluster: 2
  # Regular expressions are applied case-insensitively (research.md R3, R6).
  common_title_regex: 'common|ordinary|\bclass [a-z]\b|\bshares?\b'
  excluded_title_regex: 'preferred|warrant|\bunits?\b|\bnotes?\b|option|\brights?\b|debenture'
  plan_footnote_regex: '10b5-?1|10b-?5-?1|dividend reinvest|\bDRIP\b|employee stock purchase|\bESPP\b|automatic(ally)?\s+(purchase|reinvest)|reinvest(ed|ment) of dividends'
  offering_footnote_regex: 'public offering|underwrit|private placement|registered direct|subscription agreement|securities purchase agreement|\bPIPE\b|rights offering|directly from the (company|issuer)|from the issuer'
  ceo_cfo_title_regex: '\bCEO\b|\bCFO\b|chief executive|chief financial|principal executive|principal financial'
  # Every US venue in Tiingo's list, OTC included: Tiingo files a delisted company's whole history
