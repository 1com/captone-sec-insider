version: "3.8"

services:
  sentinel-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edgar-sentinel
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
    volumes:
      # Mount read-only serving DuckDB and export directories
      - ./data/serving.duckdb:/app/data/serving.duckdb:ro
      - ./data/exports/app:/app/data/exports/app:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/freshness"]
      interval: 30s
      timeout: 5s
      retries: 3

